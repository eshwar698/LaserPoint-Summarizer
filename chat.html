<!DOCTYPE html>
<html>
<head>
  <title>LaserPoint Chat</title>
  <style>
    body { font-family: Arial; margin: 20px; background: #f4f4f4; }
    h2 { color: #333; }
    #chat { max-width: 600px; margin: auto; }
    .message { margin: 10px 0; }
    .user { font-weight: bold; color: #0066cc; }
    .assistant { font-weight: bold; color: #009900; }
  </style>
</head>
<body>
  <div id="chat">
    <h2>Chat with <span style="color: #ff0055">LaserPoint</span></h2>
    <div id="conversation"></div>
    <input type="text" id="userInput" placeholder="Type your message..." style="width: 80%;">
    <button onclick="sendMessage()">Send</button>
  </div>

  <script>
    async function sendMessage() {
      const input = document.getElementById("userInput").value;
      if (!input) return;

      const convoDiv = document.getElementById("conversation");
      convoDiv.innerHTML += `<div class='message user'>You: ${input}</div>`;

      const res = await fetch("http://127.0.0.1:8080/v1/chat/completions", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "LaserPoint",
          messages: [
            { role: "system", content: "You are LaserPoint, a helpful summarization assistant." },
            { role: "user", content: input }
          ],
          temperature: 0.7,
          max_tokens: 500,
          stream: false
        })
      });

      const data = await res.json();
      const reply = data.choices?.[0]?.message?.content || "(No reply)";
      convoDiv.innerHTML += `<div class='message assistant'>LaserPoint: ${reply}</div>`;
      document.getElementById("userInput").value = "";
    }
  </script>
</body>
</html>
